name: 功能建议
description: 提议具有明确用户价值和验收标准的新能力
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景和当前限制，不要只描述期望采用的技术方案。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 说明完成后用户能够做什么。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 建议范围
      description: 列出本次需要包含和明确不包含的内容。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 用户可以……
        - [ ] 失败时……
        - [ ] macOS 和 Windows……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可选。说明现有绕过方式或更小的实现方案。
