[package]
name = "nocterm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nocterm cross-platform desktop terminal"

[lib]
name = "nocterm_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom.workspace = true
nocterm-application = { path = "../../../crates/nocterm-application" }
nocterm-domain = { path = "../../../crates/nocterm-domain" }
nocterm-infrastructure = { path = "../../../crates/nocterm-infrastructure" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
toml.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
